[project]
name = "gigbid-student-project"
version = "1.0.0"
description = "Evidence-grounded freelancer opportunity copilot with human approval gates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "langgraph>=0.2.60,<1",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langchain>=0.3,<2",
  "langchain-mcp-adapters>=0.1,<1",
  "mcp>=1.12,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "Pillow>=11,<13",
]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "apps*", "gigsim*", "mcp_servers*", "rag*", "evals*", "worker*"]
exclude = ["data*", "infra*", "instructions*", "tests*"]

[tool.setuptools.data-files]
"share/gigbid/sample" = [
  "data/sample/client_history.json",
  "data/sample/freelancers.json",
  "data/sample/jobs.json",
  "data/sample/portfolio_items.json",
]
